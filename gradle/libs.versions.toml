[versions]
# NOTE: if Android Studio reports a version as missing or offers an upgrade, it's usually safe to
# accept it — except material3: the Expressive APIs used here only exist in its alpha line (see below),
# so don't move it to a stable release that lacks them.
agp = "9.3.1"
kotlin = "2.4.20"
ksp = "2.3.14"
composeBom = "2026.09.00"
# Material 3 Expressive APIs (MaterialExpressiveTheme, MotionScheme, LoadingIndicator,
# FloatingActionButtonMenu, MaterialShapes) live in the alpha line. Bump to the newest
# 1.4/1.5 alpha or stable that still contains them.
material3 = "1.5.0-rc01"
coreKtx = "1.16.0"
activityCompose = "1.10.1"
lifecycle = "2.9.1"
navigation = "2.9.0"
room = "2.8.5"
coroutines = "1.10.2"
serialization = "1.13.0"
mlkitText = "16.0.1"
coil = "2.7.0"
androidsvg = "1.4"
# Gemini Nano (built into some phones) via ML Kit GenAI.
genaiPrompt = "1.0.0-beta4"
junit = "4.13.2"
profileinstaller = "1.4.1"
exifinterface = "1.3.7"

[libraries]
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
materialkolor = { group = "com.materialkolor", name = "material-kolor", version = "5.0.1" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkitText" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
androidsvg = { group = "com.caverock", name = "androidsvg-aar", version.ref = "androidsvg" }
genai-prompt = { group = "com.google.mlkit", name = "genai-prompt", version.ref = "genaiPrompt" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
